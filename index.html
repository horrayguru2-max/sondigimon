<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<title>K2 Monster Practice</title>
<style>
:root{--ink:#2b2350;--accent:#ffb300;--ok:#33b86a;--bad:#ef5350;--card:#fff;--bg1:#7ec4f2;--bg2:#d9f1ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#8fd0ff,#e9f7ff 60%,#c9f0c0);user-select:none}
button{font-family:inherit;cursor:pointer;border:0}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:12px 14px 24px;display:flex;flex-direction:column;gap:10px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{background:#fff;border-radius:20px;padding:6px 14px;font-weight:800;font-size:15px;box-shadow:0 3px 0 #0001}
.icon-btn{background:#fff;border-radius:50%;width:42px;height:42px;font-size:20px;box-shadow:0 3px 0 #0002}
.stage{position:relative;height:330px;border-radius:26px;background:linear-gradient(#6fb7ee 0%,#a9dcfb 58%,#7cc36c 58%,#5fae53 100%);box-shadow:0 6px 0 #0002;overflow:hidden;display:flex;justify-content:center;align-items:flex-end}
.stage .pv{margin-bottom:4px}
.stage::before{content:"☁️";position:absolute;left:8%;top:10%;font-size:44px;opacity:.9}
.stage::after{content:"☁️";position:absolute;right:10%;top:20%;font-size:34px;opacity:.8}
.info{background:#fff;border-radius:22px;padding:12px 14px;box-shadow:0 4px 0 #0002;display:flex;flex-direction:column;gap:8px}
.pname{font-size:24px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lv{font-size:14px;background:var(--accent);color:#fff;border-radius:10px;padding:2px 9px}
.pow{font-weight:800;color:#d9480f;font-size:17px}
.pow small{color:#888;font-weight:600}
.bar{position:relative;height:26px;background:#e8e5f7;border-radius:14px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffd34d,#ff9f1a);border-radius:14px;transition:width .5s}
.bar span{position:relative;display:block;text-align:center;line-height:26px;font-weight:800;font-size:14px}
.subs{display:flex;gap:6px;flex-wrap:wrap}
.sub{font-size:13px;font-weight:800;border-radius:12px;padding:3px 9px;background:#f0eefb}
.sub.ok{background:#d4f5df;color:#14793d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbtn{position:relative;border-radius:22px;padding:16px 8px;color:#fff;font-weight:900;font-size:22px;box-shadow:0 6px 0 #0003;display:flex;flex-direction:column;align-items:center;gap:2px}
.sbtn small{font-size:12px;font-weight:700;opacity:.95}
.sbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #0003}
.sbtn .x2{position:absolute;right:8px;top:-8px;background:#ff3d71;border-radius:12px;padding:2px 8px;font-size:13px}
.s-bm{background:#e4572e}.s-en{background:#2f80ed}.s-math{background:#27ae60}.s-zh{background:#9b51e0}
.evo{background:linear-gradient(90deg,#ffd34d,#ff7a00);color:#fff;font-size:22px;font-weight:900;border-radius:22px;padding:14px;box-shadow:0 6px 0 #b35a00;animation:pulseb 1s ease-in-out infinite}
@keyframes pulseb{50%{transform:scale(1.04)}}
.foot{display:flex;justify-content:center;gap:10px}
.ghost{background:#ffffffb0;border-radius:16px;padding:8px 16px;font-weight:800;color:var(--ink)}

/* pet view + auras */
.pv{position:relative;width:var(--size,260px);height:var(--size,260px);flex:none}
.pv .body{position:absolute;inset:0;transform-origin:50% 100%;animation:bob 2s ease-in-out infinite;transition:transform .4s;z-index:3}
.pv img{width:100%;height:100%;display:block;pointer-events:none}
@keyframes bob{50%{transform:translateY(-3%)}}
.pv .ring,.pv .rainbow,.pv .crown,.pv .spark,.pv .flame{display:none}
.pv .ring{position:absolute;left:50%;bottom:1%;width:70%;height:12%;margin-left:-35%;border-radius:50%;z-index:1;border:4px solid #4aa8ff;box-shadow:0 0 18px #4aa8ff,inset 0 0 14px #4aa8ff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
.pv.t10 .ring{display:block}
.pv.t20 .ring{border-color:#b06bff;box-shadow:0 0 18px #b06bff,inset 0 0 14px #b06bff}
.pv .spark{position:absolute;z-index:4;pointer-events:none;animation:floatup 2.4s linear infinite;opacity:0}
@keyframes floatup{0%{transform:translateY(20px) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-110px) scale(1.1);opacity:0}}
.pv.t20 .spark.a,.pv.t100 .spark.b{display:block}
.pv .crown{position:absolute;left:50%;margin-left:-.5em;font-size:calc(var(--size,260px)*.16);z-index:5;animation:bob 1.6s ease-in-out infinite}
.pv.t30 .crown{display:block}
.pv .flame{position:absolute;z-index:2;font-size:calc(var(--size,260px)*.12);pointer-events:none;animation:flame 1.1s ease-in infinite;opacity:0}
@keyframes flame{0%{transform:translate(0,0) scale(1);opacity:.95}100%{transform:translate(-50px,-45px) scale(.2);opacity:0}}
.pv.t40 .flame{display:block}
.pv.t50 .body{transform:scale(1.1)}
.pv.t50 img{filter:drop-shadow(0 0 14px #ffd34d)}
.pv .rainbow{position:absolute;left:10%;top:15%;width:80%;height:80%;border-radius:50%;z-index:0;background:conic-gradient(red,orange,yellow,lime,cyan,blue,violet,red);filter:blur(20px);opacity:.5;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pv.t100 .rainbow{display:block}

/* pick */
.title{font-size:26px;font-weight:900;text-align:center;margin:6px 0}
.pcard{position:relative;perspective:600px}
.pcard .thumb{transform-style:preserve-3d;backface-visibility:hidden}
.pcard .lvb{position:absolute;left:50%;top:6px;transform:translateX(-50%) scale(.6);background:linear-gradient(#ffd84a,#ff9f1c);color:#5a2d00;font-size:15px;font-weight:900;padding:3px 12px;border-radius:999px;box-shadow:0 3px 0 #0003;opacity:0;pointer-events:none;white-space:nowrap;z-index:2;transition:all .25s}
.pcard .lvb.on{opacity:1;transform:translateX(-50%) scale(1)}
.pcard.armed{outline:4px dashed #ff9f1c}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:#fff;border-radius:22px;padding:12px 6px;box-shadow:0 5px 0 #0002;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:19px}
.pcard small{font-size:13px;color:#888;font-weight:700}
.pcard.cur{outline:4px solid var(--accent)}
.pimg{width:150px;height:120px;overflow:hidden;position:relative}
.pimg img{width:270px;position:absolute;left:-60px;bottom:-5px}
.pcard:active{transform:translateY(3px)}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dot{width:16px;height:16px;border-radius:50%;background:#fff8;border:2px solid #fff}
.dot.cur{background:var(--accent)}.dot.ok{background:var(--ok)}.dot.no{background:#aaa}
.qcard{background:#fff;border-radius:24px;padding:16px;box-shadow:0 5px 0 #0002;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.qtext{font-size:23px;font-weight:800;line-height:1.35}
.qtext small{display:block;font-size:15px;color:#6a6a8a;font-weight:600}
.big{font-size:88px;line-height:1.1}
.bigch{font-size:96px;font-weight:700;line-height:1.1;font-family:"KaiTi","STKaiti","Microsoft YaHei",serif}
.passage{background:#fff7e0;border-radius:16px;padding:12px 14px;font-size:20px;line-height:1.6;text-align:left;width:100%}
.scene{display:flex;align-items:center;justify-content:center;font-size:64px;line-height:1;min-height:120px}
.scene.col{flex-direction:column;min-height:150px}
.scene .inbox{position:relative}.scene .inbox i{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:.45em;font-style:normal}
.scene .fr{margin-left:-.55em;position:relative;z-index:2}
.clock{width:170px;height:170px}
.speak{background:#e8f4ff;border-radius:18px;padding:6px 14px;font-size:18px;font-weight:800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{background:#fff;border-radius:20px;padding:16px 8px;font-size:23px;font-weight:800;box-shadow:0 5px 0 #0002;color:var(--ink);min-height:64px}
.opt:active{transform:translateY(3px)}
.opt .osp{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:18px;background:#e8f4ff;border-radius:50%;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #0002}
.opt:has(.osp){padding-right:48px}
.opt.good{background:var(--ok);color:#fff}
.opt.bad{background:#ffd9d9;opacity:.8}
.opt.gone{visibility:hidden}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:34px;text-align:center;font-size:20px;font-weight:900}
.fb.ok{color:#14793d}.fb.no{color:#c62828}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:56px;font-weight:900;color:#ff9f1a;text-shadow:0 3px 0 #fff,0 0 20px #fff;animation:popup 1s ease-out forwards;z-index:50;pointer-events:none;white-space:nowrap}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
.next{background:var(--accent);color:#fff;border-radius:20px;padding:14px;font-size:22px;font-weight:900;box-shadow:0 5px 0 #b37d00}
.ans{min-height:68px;background:#f0eefb;border-radius:18px;padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;width:100%}
.wbank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chipw{background:#fff;border-radius:16px;padding:10px 16px;font-size:23px;font-weight:800;box-shadow:0 4px 0 #0002;border:2px solid #d8d3f3}
.chipw.hide{visibility:hidden}
.ans .chipw{background:#fff7e0;border-color:var(--accent)}

/* result / evolve */
.center{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.rs{font-size:34px;font-weight:900}
.flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:60;pointer-events:none}
.flash.go{animation:flash 1.2s ease-in-out forwards}
@keyframes flash{0%{opacity:0}45%{opacity:1}100%{opacity:0}}
.glow img{animation:glowy 1.4s ease-in forwards}
@keyframes glowy{0%{filter:brightness(1)}100%{filter:brightness(6) saturate(0)}}
.hop{animation:hop .6s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-16px)}}
.confetti{position:fixed;top:-30px;font-size:30px;z-index:40;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.hidden{display:none}

/* ---- P1: battle / shop / skills ---- */
.top{flex-wrap:wrap}
.chip.gem{background:#e6f6ff;color:#0b6fa8}
.stline{font-weight:800;font-size:15px;color:#555}
.eqbar{display:flex;gap:6px;flex-wrap:wrap}
.eqs{width:38px;height:38px;border-radius:12px;background:#f0eefb;display:grid;place-items:center;font-size:18px;opacity:.55}
.eqs.on{opacity:1;background:#fff4d6;box-shadow:inset 0 0 0 2px #ffcf5a}
.eqs img{width:32px;height:32px;object-fit:contain}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.abtn{position:relative;border-radius:20px;padding:12px 4px;color:#fff;font-size:30px;box-shadow:0 5px 0 #0003;display:flex;flex-direction:column;align-items:center}
.abtn b{font-size:17px}
.abtn:active{transform:translateY(3px)}
.abtn .x2{position:absolute;right:6px;top:-8px;background:#ff3d71;border-radius:12px;padding:1px 9px;font-size:14px;font-weight:800}
.a-battle{background:#ef5a5a}.a-shop{background:#1fa7e8}.a-skill{background:#8e5bd6}
.pv .eqhead{position:absolute;left:50%;z-index:6;transform-origin:50% 90%;animation:hatfloat 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 4px #0003)}
@keyframes hatfloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7%) rotate(4deg)}}
.pv .eqsword{position:absolute;bottom:3%;z-index:6;transform-origin:22% 88%;animation:swordfloat 2.8s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(140,210,255,.95))}
@keyframes swordfloat{0%,100%{transform:rotate(6deg) translateY(0)}50%{transform:rotate(17deg) translateY(-7%)}}
.pv.hashead .crown{display:none!important}
.pv img.eqhead,.pv img.eqsword{height:auto}
/* battle */
.bscene{display:flex;align-items:flex-end;justify-content:space-between;background:linear-gradient(#6fb7ee 0%,#a9dcfb 55%,#7cc36c 55%,#5fae53 100%);border-radius:22px;padding:8px 8px 10px;box-shadow:0 5px 0 #0002;min-height:210px}
.bside{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:44%}
.vs{font-size:28px;padding-bottom:70px}
.mimg{width:140px;height:140px;object-fit:contain;animation:bob 2s ease-in-out infinite}
.hp{position:relative;width:100%;height:20px;border-radius:12px;background:#0004;overflow:hidden}
.hp i{position:absolute;left:0;top:0;bottom:0;transition:width .4s}
.hp.pet i{background:#3ddc84}.hp.mon i{background:#ff5d5d}
.hp span{position:relative;display:block;text-align:center;line-height:20px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000a}
.hurt{animation:hurt .45s}
@keyframes hurt{20%{transform:translateX(-8px);filter:brightness(2) saturate(2)}60%{transform:translateX(8px)}100%{transform:none}}
.dmg{position:absolute;top:10px;font-size:28px;font-weight:900;color:#fff;text-shadow:0 2px 0 #c00,0 0 8px #000;animation:dmgup .9s ease-out forwards;z-index:9;pointer-events:none}
@keyframes dmgup{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(-4px) scale(1.2)}100%{opacity:0;transform:translateY(-50px)}}
.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pill{background:#fff;border-radius:16px;padding:6px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 #0002}
.pill.on{background:var(--accent);color:#fff}
.mcard{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:8px 12px;box-shadow:0 4px 0 #0002;text-align:left;width:100%;color:var(--ink)}
.mcard img{width:74px;height:74px;object-fit:contain}
.mcard .mt{flex:1;font-weight:900;font-size:17px}.mcard small{display:block;font-weight:700;color:#777;font-size:13px}
.mcard.lock{opacity:.5}.mcard .go2{background:#ef5a5a;color:#fff;border-radius:14px;padding:8px 14px;font-weight:900}
.regt{font-weight:900;font-size:18px;margin:6px 2px 0}
.col{display:flex;flex-direction:column;gap:8px}
/* shop */
.tabs{display:flex;gap:6px}.tab{flex:1;background:#fff;border-radius:14px;padding:8px 2px;font-weight:800;font-size:14px;box-shadow:0 3px 0 #0002;color:var(--ink)}.tab.on{background:var(--p,#7b4fe0);color:#fff}
.items{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icard{background:#fff;border-radius:20px;padding:10px 6px;text-align:center;box-shadow:0 4px 0 #0002;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.icard img{width:86px;height:86px;object-fit:contain}
.icard small{color:#c0392b;font-weight:800;font-size:13px}
.buy{margin-top:4px;border-radius:14px;padding:8px 14px;font-weight:900;font-size:16px;color:#fff;background:#1fa7e8;box-shadow:0 3px 0 #0003}
.buy.off{background:#aaa}.buy.wear{background:#27ae60}.buy.on{background:#e67e22}
.skrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:10px 14px;box-shadow:0 4px 0 #0002}
.skrow .em{font-size:34px}.skt{flex:1}.skt b{font-size:20px;display:block}.skt small{color:#777;font-weight:700}
.skn{font-size:26px;font-weight:900;min-width:30px;text-align:center}
.plus{width:46px;height:46px;border-radius:50%;background:#8e5bd6;color:#fff;font-size:26px;font-weight:900;box-shadow:0 3px 0 #0003}.plus:disabled{background:#bbb}
.note2{font-size:13px;color:#777;font-weight:600}

/* ---- v3: obvious glow + light pillar + battle dash + evolution preview ---- */
.grid3{grid-template-columns:1fr 1fr}
.pv .ring,.pv.t20 .ring{border-width:5px;border-color:var(--pc,#35a7ff);box-shadow:0 0 22px var(--pc),0 0 46px var(--pc),inset 0 0 18px var(--pc)}
.pv.t10 .body img{filter:drop-shadow(0 0 10px var(--pc)) drop-shadow(0 0 24px var(--pc))}
.pv.t30 .body img{filter:drop-shadow(0 0 14px var(--pc)) drop-shadow(0 0 34px var(--pc))}
.pv.t50 .body img{filter:drop-shadow(0 0 18px var(--pc)) drop-shadow(0 0 44px var(--pc))}
.pv .pillar{display:none;position:absolute;left:50%;bottom:3%;width:58%;height:94%;transform:translateX(-50%);z-index:0;border-radius:50% 50% 40% 40%/8% 8% 4% 4%;background:linear-gradient(90deg,transparent,var(--pc) 26%,#fff 50%,var(--pc) 74%,transparent);opacity:.6;filter:blur(6px);-webkit-mask-image:linear-gradient(to top,#000 55%,transparent);mask-image:linear-gradient(to top,#000 55%,transparent);animation:pillar 1.8s ease-in-out infinite}
.pv .pillar::before{content:"";position:absolute;left:4%;right:4%;top:0;height:12%;border-radius:50%;background:#fff;opacity:.85}
.pv.t10 .pillar{display:block}
.pv.t30 .pillar{opacity:.75;width:66%}
.pv.t50 .pillar{opacity:.9;width:74%}
@keyframes pillar{50%{opacity:1;transform:translateX(-50%) scaleX(1.14)}}
.bside.dashing{animation:dashgo .8s ease-in-out;z-index:20}
@keyframes dashgo{0%{transform:translateX(0)}28%{transform:translateX(var(--dx)) scale(1.18)}42%{transform:translateX(calc(var(--dx)*.92)) scale(1.1)}100%{transform:translateX(0)}}
.boom{position:absolute;top:34%;left:50%;font-size:60px;transform:translate(-50%,-50%);animation:boom .6s ease-out forwards;z-index:12;pointer-events:none}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}60%{transform:translate(-50%,-50%) scale(1.5)}100%{transform:translate(-50%,-50%) scale(1.9);opacity:0}}
.hp.mon::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/var(--segs,10) - 2px),#0007 calc(100%/var(--segs,10) - 2px),#0007 calc(100%/var(--segs,10)))}
.hp span{z-index:2}
.stage.prev{justify-content:space-between;align-items:flex-end;padding:0 6px}
.evoprev{position:relative;width:156px;display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:8px;z-index:6}
.evoprev .bubble{width:100%;background:#fff;border-radius:14px;padding:6px 9px 7px;font-size:12px;font-weight:800;text-align:left;line-height:1.5;box-shadow:0 3px 0 #0002;color:#4a3a7a}
.evoprev .bt{font-size:12px;font-weight:900;color:#7b2ff7;border-bottom:2px dotted #d9ccff;margin-bottom:3px;padding-bottom:2px}
.evoprev .bh{font-size:11px;font-weight:900;color:#fff;background:#9b6bff;border-radius:8px;padding:0 6px;margin:3px 0 1px}
.evoprev .br{display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
.evoprev .br b{color:#e0561b}.evoprev .br.ok b{color:#1e9e55}
.evoprev canvas{width:104px;height:104px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 0 8px #fff8)}
.evoprev .q{position:absolute;bottom:34px;font-size:38px;font-weight:900;color:#fff;text-shadow:0 2px 6px #000a}
.evoprev .tierico{font-size:60px}
.ctab{border-collapse:collapse;font-size:22px;margin:6px auto}.ctab td{border:2px solid #333;padding:4px 14px;min-width:60px;font-weight:800}

/* ---- v6: players, adventure header, bag ---- */
.sub2{text-align:center;color:#5a5a8a;font-weight:700;margin:-4px 0 6px}
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;gap:8px;align-items:stretch}
.pbtn{flex:1;display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:10px 14px;box-shadow:0 5px 0 #0002;text-align:left;color:var(--ink)}
.pbtn:active{transform:translateY(3px)}
.pbtn .av{width:70px;height:70px;border-radius:50%;background:linear-gradient(#cfe9ff,#eaf7ff);display:grid;place-items:center;overflow:hidden;flex:none}
.pbtn .av img{width:100%;height:100%;object-fit:contain;object-position:bottom;transform:scale(1.15)}
.pbtn .av.q{font-size:36px;font-weight:900;color:#7b4fe0}
.pbtn .pn{font-size:24px;font-weight:900;display:block}

/* ================= power ================= */
function needStars(n){ if(n<=30)return 5*(n-1); let t=145; for(let i=31;i<=n;i++)t+=5+(i-30); return t }
function rawPower(stars){ let p=1; while(needStars(p+1)<=stars)p++; return p }
function power(p){ return Math.min(rawPower(p.stars),CAP[p.stage]) }
function ssOf(p){if(!p.ss)p.ss={bm:0,en:0,math:0,zh:0};return p.ss}            // stars earned per subject (new: lets a kid evolve by drilling ONE subject)
function bestSub(p){const ss=ssOf(p);return SKEYS.reduce((a,k)=>ss[k]>ss[a]?k:a,SKEYS[0])}
function evoPath(p){ const r=EVO[p.stage]; if(!r)return null; const ss=ssOf(p);
  if(SKEYS.some(k=>ss[k]>=r.stars))return 'single';                                  // route 1: one subject alone earns enough stars
  if(p.stars>=r.stars && SKEYS.every(k=>p.correct[k]>=r.each))return 'all';          // route 2: all four subjects together
  return null }
function canEvolve(p){ return !!evoPath(p) }

let VOICES=[],VWARNED={};
function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){}}
if(window.speechSynthesis){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}}
function pickVoice(lang){
  if(!VOICES.length)loadVoices();
  const L=lang.toLowerCase().replace('_','-'),p=L.slice(0,2);
  const by=f=>VOICES.find(f);
  let v=by(x=>x.lang.toLowerCase().replace('_','-')===L)||by(x=>x.lang.toLowerCase().startsWith(p));
  if(!v&&p==='ms')v=by(x=>/^id/i.test(x.lang))||by(x=>/malay|indones/i.test(x.name));
  if(!v&&p==='zh')v=by(x=>/chinese|mandarin|cantonese|中文|普通话|國語|国语/i.test(x.name))||by(x=>/^(cmn|yue)/i.test(x.lang));
  return v||null;
}
function speak(text,lang){
  if(!S.sound||!window.speechSynthesis||!text)return;
  try{
    speechSynthesis.cancel();
    const v=pickVoice(lang||'en-US'),u=new SpeechSynthesisUtterance(String(text));
    if(v){u.voice=v;u.lang=v.lang}else{u.lang=lang||'en-US';
      const p=(lang||'').slice(0,2);
      if((p==='ms'||p==='zh')&&VOICES.length&&!VWARNED[p]){VWARNED[p]=1;
        const t=document.createElement('div');t.textContent=p==='zh'?'📢 This device has no Chinese voice. Install one in Settings › Speech / Accessibility › Spoken Content.':'📢 This device has no Malay voice. Install one in Settings › Speech / Accessibility › Spoken Content.';
        t.style.cssText='position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:99;background:#fff3cd;color:#5a4300;padding:10px 16px;border-radius:14px;font:700 14px system-ui;box-shadow:0 4px 12px #0003;max-width:90vw;text-align:center';
        document.body.appendChild(t);setTimeout(()=>t.remove(),6000)}}
    u.rate=.8;
    if(speechSynthesis.paused)speechSynthesis.resume();
    speechSynthesis.speak(u);
  }catch(e){}
}

function MQ(zh,en,a,wrong,extra){ const hz=/[\u4e00-\u9fff]/.test(zh); return Object.assign({t:'choice',math:true,text:hz?en:`${zh}<small>${en}</small>`,say:hz?en:zh,a:String(a),opts:[String(a),...wrong.map(String)],emoji:''},extra||{}) }
function clockSVG(h,m){
  const ha=((h%12)*30+m*.5)*Math.PI/180, ma=m*6*Math.PI/180;
  let ticks='';for(let i=0;i<12;i++){const a=i*30*Math.PI/180;ticks+=`<text x="${85+62*Math.sin(a)}" y="${90-62*Math.cos(a)}" font-size="16" font-weight="800" text-anchor="middle" fill="#2b2350">${i===0?12:i}</text>`}
  return `<svg class="clock" viewBox="0 0 170 170"><circle cx="85" cy="85" r="80" fill="#fff" stroke="#2b2350" stroke-width="5"/>${ticks}<line x1="85" y1="85" x2="${85+38*Math.sin(ha)}" y2="${85-38*Math.cos(ha)}" stroke="#e4572e" stroke-width="7" stroke-linecap="round"/><line x1="85" y1="85" x2="${85+56*Math.sin(ma)}" y2="${85-56*Math.cos(ma)}" stroke="#2f80ed" stroke-width="5" stroke-linecap="round"/><circle cx="85" cy="85" r="5" fill="#2b2350"/></svg>`;
}
const NAMES=[['小明','Ming'],['小美','Mei'],['阿强','Ah Keong'],['小花','Hua']];
const WORDITEMS=[['苹果','apples','🍎'],['气球','balloons','🎈'],['糖果','sweets','🍬'],['玩具车','toy cars','🚗'],['贴纸','stickers','⭐']];
const fmtT=(h,m)=>`${h}:${m<10?'0'+m:m}`;
const fmtRM=c=>'RM'+(c/100).toFixed(2);
const ADDT=[['安娜买了 {a} 粒咖喱面包和 {b} 粒巧克力面包，她共买了多少粒面包？','Anna buys {a} curry buns and {b} chocolate buns. How many buns altogether?','🥐'],['梅有 {a} 只黄色的鱼和 {b} 只红色的鱼，她共有多少只鱼？','May has {a} yellow fish and {b} red fish. How many fish altogether?','🐟'],['汤姆有 {a} 颗糖果，妈妈又给他 {b} 颗，现在共有多少颗糖果？','Tom has {a} candies. His mother gave him {b} more. How many candies altogether?','🍬']];
const SUBT=[['停车场有 {a} 辆汽车，{b} 辆汽车开走了。还剩多少辆汽车？','There are {a} cars in the parking lot. {b} cars drove away. How many cars are left?','🚗'],['池塘里有 {a} 只青蛙，{b} 只青蛙跳走了。池塘里还剩多少只青蛙？','There are {a} frogs in the pond. {b} frogs jumped away. How many frogs are left?','🐸'],['盘子里有 {a} 块纸杯蛋糕，妈妈给了邻居 {b} 块。盘子里还剩多少块？','There are {a} cupcakes on the plate. Mom gave {b} to the neighbour. How many cupcakes are left?','🧁']];
const RMITEMS=[['🥤','energy drink',480],['🍕','pizza',690],['🍟','chips',155],['🍰','cake',395]];
function genMath(P){
  const R=P<10?20:P<30?50:100;
  const pool=['compare','next','add','sub','addw','subw','clock','coin','tens','chart'];
  if(P<20)pool.push('bond','bond','count');
  if(P<15)pool.push('numline');
  if(P>=8)pool.push('carry','borrow','minutes');
  if(P>=15)pool.push('hundreds','pastfut','carry','borrow','candy');
  if(P>=25)pool.push('rmsum','rmsum');
  const type=pick(pool);
  let q;
  switch(type){
   case 'count':{const n=1+rnd(Math.min(R,12)),e=pick(['🍎','⭐','🐟','🎈','🍪']);q=MQ('有几个？','How many?',n,near(n),{scene:`<div class="scene" style="font-size:36px;flex-wrap:wrap">${e.repeat(n)}</div>`});break}
   case 'compare':{let a=1+rnd(R),b=1+rnd(R);while(a===b)b=1+rnd(R);const big=Math.random()<.5;const good=big?Math.max(a,b):Math.min(a,b),other=big?Math.min(a,b):Math.max(a,b);
       q=MQ(big?'哪个数比较大？':'哪个数比较小？',big?'Which number is bigger?':'Which number is smaller?',good,[other]);break}
   case 'next':{const n=2+rnd(R-2);const after=Math.random()<.5;q=after?MQ(`${n} 后面的数是？`,`What comes after ${n}?`,n+1,near(n+1)):MQ(`${n} 前面的数是？`,`What comes before ${n}?`,n-1,near(n-1));break}
   case 'add':{const a=1+rnd(R-1),b=1+rnd(R-a);q=MQ(`${a} + ${b} = ?`,'Add',a+b,near(a+b));break}
   case 'sub':{const a=2+rnd(R-1),b=1+rnd(a-1);q=MQ(`${a} − ${b} = ?`,'Subtract',a-b,near(a-b));break}
   case 'tens':{const n=11+rnd(R-10),t=Math.floor(n/10),u=n%10;q=MQ(`${n} 是几个十和几个一？`,`${n} = how many tens and ones?`,`${t} tens ${u} ones`,[`${u} tens ${t} ones`,`${t+1} tens ${u} ones`]);break}
   case 'bond':{const t=P<10?5+rnd(6):10+rnd(11),a=1+rnd(t-1);q=MQ(`${t} 可以分成 ${a} 和几？`,`Number bond: ${t} = ${a} + ?`,t-a,near(t-a));break}
   case 'numline':{const a=5+rnd(16),b=1+rnd(Math.min(9,a-1));q=MQ(`用数线做减法：${a} − ${b} = ?`,`Subtract with the number line: ${a} − ${b}`,a-b,near(a-b),{emoji:'📏'});break}
   case 'carry':{let a=25,b=19,g=0,m=Math.max(R,50);for(;g<300;g++){const x=11+rnd(m-12),y=11+rnd(m-12);if((x%10)+(y%10)>=10&&x+y<=99){a=x;b=y;break}}
       q=MQ(`${a} + ${b} = ?`,'Addition with carrying (tens and ones)',a+b,near(a+b),{emoji:'➕'});break}
   case 'borrow':{let a=45,b=29,g=0,m=Math.max(R,50);for(;g<300;g++){const x=21+rnd(Math.min(m,99)-20),y=11+rnd(x-11);if(x>y&&(x%10)<(y%10)){a=x;b=y;break}}
       q=MQ(`${a} − ${b} = ?`,'Subtraction with borrowing (tens and ones)',a-b,near(a-b),{emoji:'➖'});break}
   case 'addw':{const [zh,en,em]=pick(ADDT),a=2+rnd(Math.floor(R/2)),b=2+rnd(Math.floor(R/2));q=MQ(zh.replace('{a}',a).replace('{b}',b),en.replace('{a}',a).replace('{b}',b),a+b,near(a+b),{emoji:em});break}
   case 'subw':{const [zh,en,em]=pick(SUBT),a=5+rnd(Math.floor(R/1.5)),b=1+rnd(a-1);q=MQ(zh.replace('{a}',a).replace('{b}',b),en.replace('{a}',a).replace('{b}',b),a-b,near(a-b),{emoji:em});break}
   case 'clock':{const h=1+rnd(12),m=Math.random()<.5?0:30;const a=fmtT(h,m);const w=new Set();while(w.size<2){const x=fmtT(1+rnd(12),Math.random()<.5?0:30);if(x!==a)w.add(x)}q=MQ('现在几点？','What time is it?',a,[...w],{scene:`<div class="scene">${clockSVG(h,m)}</div>`});break}
   case 'minutes':{
       if(Math.random()<.15){q=MQ('一小时有几分钟？','How many minutes are there in an hour?','60',['30','100'],{emoji:'⏰'});break}
       const h=1+rnd(12),m=5*rnd(12),a=fmtT(h,m),w=new Set();
       while(w.size<2){const x=Math.random()<.5?fmtT(h,(m+5*(1+rnd(11)))%60):fmtT(1+rnd(12),m);if(x!==a)w.add(x)}
       q=MQ('现在几点？（短针是小时，长针是分钟）','What time is it? (short hand = hour, long hand = minutes)',a,[...w],{scene:`<div class="scene">${clockSVG(h,m)}</div>`});break}
   case 'pastfut':{const h=1+rnd(12),m=5*rnd(12),fut=Math.random()<.5,t=fmtT(h,m);
       const tm=((h%12)*60+m+(fut?5:-5)+720)%720,hh=Math.floor(tm/60)||12,mm=tm%60,a=fmtT(hh,mm);
       const w=new Set();while(w.size<2){const x=fmtT(hh,(mm+5*(1+rnd(11)))%60);if(x!==a)w.add(x)}
       q=MQ(`现在是 ${t}。5 分钟${fut?'后':'前'}是几点？`,`It is ${t} now. What time is it 5 minutes ${fut?'later':'ago'}?`,a,[...w],{scene:`<div class="scene">${clockSVG(h,m)}</div>`});break}
   case 'chart':{const names=['Joshua','Ava','Lily','Laura','Jessica','Timmy'];let flags,cnt;do{flags=names.map(()=>Math.random()<.5);cnt=flags.filter(Boolean).length}while(cnt<1);
       const tb='<table class="ctab"><tr><td></td><td>Yes ✔</td><td>No</td></tr>'+names.map((n,i)=>`<tr><td>${n}</td><td>${flags[i]?'✔':''}</td><td>${flags[i]?'':'✔'}</td></tr>`).join('')+'</table>';
       q=MQ('「Yes」那一栏有几个 ✔？','How many ticks are in the "Yes" column?',cnt,near(cnt),{scene:tb});break}
   case 'hundreds':{const k=2+rnd(8);
       if(Math.random()<.6)q=MQ(`每袋有 100 颗弹珠，${k} 袋一共有几颗？`,`Each bag has 100 marbles. How many marbles in ${k} bags?`,k*100,[k*100+100,k*100-100],{emoji:'🔮'});
       else q=MQ(`${k*100} 是几个一百？`,`${k*100} = how many hundreds?`,k,near(k).map(x=>Math.max(1,x)),{emoji:'💯'});break}
   case 'coin':{const cs=[5,10,20,50],n=2+rnd(3),arr=Array.from({length:n},()=>pick(cs)),sum=arr.reduce((x,y)=>x+y,0);
       q=MQ(arr.map(x=>`🪙${x}sen`).join(' + ')+' = ?','Add the coins',money(sum),[money(sum+10),money(Math.max(5,sum-10))],{emoji:'🪙'});break}
   case 'candy':{const cs=[5,10,12,15],n=2+rnd(2),arr=Array.from({length:n},()=>pick(cs)),sum=arr.reduce((x,y)=>x+y,0);
       q=MQ(arr.map(x=>`🍬${x}sen`).join(' + ')+' = ?','Add the prices of the sweets',sum+'sen',[(sum+5)+'sen',Math.max(1,sum-5)+'sen'],{emoji:'🍬'});break}
   case 'rmsum':{let x=pick(RMITEMS),y=pick(RMITEMS);while(y===x)y=pick(RMITEMS);const sum=x[2]+y[2];
       q=MQ(`${x[0]} ${fmtRM(x[2])} + ${y[0]} ${fmtRM(y[2])} 一共多少钱？`,`${x[1]} ${fmtRM(x[2])} + ${y[1]} ${fmtRM(y[2])}. What is the total?`,fmtRM(sum),[fmtRM(sum+100),fmtRM(sum-100)],{emoji:x[0]+y[0]});break}
  }
  q.opts=Array.from(new Set(q.opts));
  while(q.opts.length<2)q.opts.push(String(+q.a+1));
  return q;
}

/* ---------- change-making mini game (money) ---------- */
function money(sen){ if(sen<100)return sen+'sen'; const r=sen/100; return 'RM'+(Number.isInteger(r)?r:r.toFixed(2)) }
function genChange(P){
  const items=[['🧸','玩具','toy'],['🍪','饼干','biscuit'],['🥤','饮料','drink'],['🍦','雪糕','ice cream'],['✏️','铅笔','pencil'],['🎈','气球','balloon']];
  const [em,zh,en]=pick(items);
  let price,pay;
  if(P<10){price=100*(1+rnd(4));pay=500}
  else if(P<30){price=50*(2+rnd(8));pay=pick([500,1000])}
  else{price=10*(10+rnd(80));pay=pick([1000,2000])}
  if(pay<=price)pay=price<=500?500:price<=1000?1000:2000;
  const ans=pay-price;
  const cands=P<10?[ans+100,ans-100,ans+200]:P<30?[ans+50,ans-50,ans+100,ans-100]:[ans+10,ans-10,ans+20,ans+50,ans-50];   // easy levels: whole-RM differences only
  let wrong=shuffle([...new Set(cands.filter(x=>x!==ans&&x>0))]).slice(0,2);
  while(wrong.length<2)wrong.push(ans+100*(wrong.length+1));
  const q=MQ(`${zh} ${money(price)}，你付 ${money(pay)}。找回多少？`,`${en} ${money(price)}, you pay ${money(pay)}. Change?`,money(ans),wrong.map(money),{emoji:em+'💵'});
  q.sk='math';q.opts=[...new Set(q.opts)];
  return q;
}

/* ================= question picking ================= */
function pickQs(sk,n,P){
  let out;
  if(sk==='math'){out=[];for(let i=0;i<n;i++)out.push(genMath(P))}
  else{
    const b=BANK[sk].map(q=>{const st=S.q[q.id]||{r:0,w:0};return {q,s:st.w*2-st.r*.5+Math.random()*3}});
    b.sort((x,y)=>y.s-x.s);
    out=b.slice(0,n).map(x=>x.q);
  }
  out.forEach(q=>q.sk=sk);
  return out;
}

/* evolution showcase: point at / tap a buddy -> it turns around, levels up to Lv2, Lv3, then turns back into a baby */
let PVTOK=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function turnTo(card,k,stage,box){
  const el=card.querySelector('.thumb');if(!el)return;
  el.style.transition='transform .2s ease-in';el.style.transform='rotateY(90deg)';await wait(210);
  const tmp=document.createElement('div');tmp.innerHTML=thumb(k,stage,box);el.innerHTML=tmp.firstChild.innerHTML;
  el.style.transition='none';el.style.transform='rotateY(-90deg)';void el.offsetWidth;
  el.style.transition='transform .2s ease-out';el.style.transform='rotateY(0deg)';await wait(210);
}
async function evoShow(card,k,box){
  if(card.dataset.busy)return;card.dataset.busy='1';const tok=++PVTOK;
  const badge=card.querySelector('.lvb'),sm=card.querySelector('small'),old=sm?sm.textContent:'';
  const alive=()=>tok===PVTOK&&document.body.contains(card);
  const base=+card.dataset.st||1;
  const seq=[[2,'⬆️ Level up! Lv2',1100],[3,'🌟 Lv3 MAX!',1500],[base,'',0]];
  for(const [st,txt,hold] of seq){
    await turnTo(card,k,st,box);if(!alive())break;
    if(badge){badge.textContent=txt;badge.classList.toggle('on',!!txt)}
    if(txt){sndUP();sparkleAt(card)}
    await wait(hold);if(!alive())break;
  }
  if(badge){badge.textContent='';badge.classList.remove('on')}
  if(document.body.contains(card)){
    const th=card.querySelector('.thumb');
    if(th){const tmp=document.createElement('div');tmp.innerHTML=thumb(k,base,box);th.innerHTML=tmp.firstChild.innerHTML;th.style.transition='none';th.style.transform=''}
    delete card.dataset.busy;
  }
}
function sparkleAt(card){const r=card.getBoundingClientRect();for(let i=0;i<8;i++){const d=document.createElement('div');d.className='confetti';d.textContent=pick(['✨','⭐','🌟']);d.style.left=(r.left+r.width*(.2+Math.random()*.6))+'px';d.style.top=(r.top+r.height*.2)+'px';d.style.animationDuration='1.1s';d.style.position='fixed';document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}}
function attachShowcase(sel,box,onChoose){                  // mouse: hover previews, click chooses. touch: 1st tap previews, 2nd tap chooses
  let touch=false,armed=null;
  app.querySelectorAll(sel).forEach(b=>{
    const k=b.dataset.k;
    b.addEventListener('pointerdown',e=>{touch=e.pointerType==='touch'||e.pointerType==='pen'});
    b.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')evoShow(b,k,box)});
    b.addEventListener('click',()=>{
      if(touch&&armed!==k){armed=k;app.querySelectorAll(sel).forEach(x=>x.classList.toggle('armed',x===b));evoShow(b,k,box);return}
      onChoose(k);
    });
  });
}

function editPlayer(id){
  const pl=G.players.find(p=>p.id===id);if(!pl)return;
  const o=document.createElement('div');o.className='modal';
  o.innerHTML=`<div class="mbox"><div class="title" style="font-size:22px;margin:0">Edit player</div><input id="enm" class="nm" maxlength="12" value="${esc(pl.name)}"><button class="next" id="esave">Save</button><button class="ghost" id="edel">🗑️ Remove player</button><button class="ghost" id="ecan">Cancel</button></div>`;
  document.body.appendChild(o);
  $('#esave').onclick=()=>{const v=$('#enm').value.trim().slice(0,12);if(v)pl.name=v;save();o.remove();whoScreen()};
  let armed=false;
  $('#edel').onclick=function(){if(!armed){armed=true;this.textContent='Tap again to delete all progress';this.style.background='#ffd9d9';return}G.players=G.players.filter(p=>p.id!==id);save();o.remove();whoScreen()};
  $('#ecan').onclick=()=>o.remove();
}

function drawMosaics(){
  document.querySelectorAll('canvas.mosaic').forEach(c=>{
    const img=new Image();img.onload=()=>{
      const t=document.createElement('canvas');t.width=t.height=20;t.getContext('2d').drawImage(img,0,0,20,20);
      const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,c.width,c.height);x.drawImage(t,0,0,c.width,c.height);
      x.globalCompositeOperation='source-atop';x.fillStyle='rgba(40,20,110,.62)';x.fillRect(0,0,c.width,c.height);
    };img.src=c.dataset.src;
  });
}
const TIERS=[[10,'Blue light pillar'],[20,'Purple pillar + stars'],[30,'Gold pillar + crown'],[40,'Fire trail'],[50,'Bigger + golden glow'],[100,'Rainbow aura']];
function evoPreview(p,k){
  const r=EVO[p.stage];
  if(r){
    const ss=ssOf(p),bs=bestSub(p),need1=Math.max(0,r.stars-ss[bs]),needS=Math.max(0,r.stars-p.stars);
    const rows=[['⭐ Stars',needS>0?needS+' more':'✓'],...SKEYS.map(s=>[SUBJ[s].name,p.correct[s]>=r.each?'✓':(r.each-p.correct[s])+' more'])];
    const ready=!!evoPath(p);
    const row=(a,b)=>`<div class="br ${b==='✓'?'ok':''}"><span>${a}</span><b>${b}</b></div>`;
    const body=ready?'<div class="br ok"><span>Ready!</span><b>✓</b></div>':`<div class="bh">① Just 1 subject</div>${row('⭐ '+SUBJ[bs].name+' '+Math.min(ss[bs],r.stars)+'/'+r.stars,need1>0?need1+' more':'✓')}<div class="bh">② All 4 subjects</div>${rows.map(([a,b])=>row(a,b)).join('')}`;
    return `<div class="evoprev"><div class="bubble"><div class="bt">${ready?'Evolving…':'To evolve · pick one!'}</div>${body}</div><canvas class="mosaic" width="104" height="104" data-src="assets/pets/${k}_${p.stage+1}.png"></canvas><div class="q">?</div></div>`;
  }
  const P=power(p),nt=TIERS.find(t=>t[0]>P);

function dash(attSel,defSel,onHit){                 // attacker runs to the defender, hits, runs back

    if(m.tower)p.tower=Math.max(p.tower,m.tower);

  const up=power(p)>Q.startP;
  const inSky=ORDER2.indexOf(m.key)>=0;BWORLD=inSky?2:1;
  const oi=inSky?ORDER2.indexOf(m.key):ORDER.indexOf(m.key),nxt=(res==='win'&&oi>=0)?(inSky?(ORDER2[oi+1]||null):(ORDER[oi+1]||'tower')):null,nxtName=nxt==='tower'?'Endless Tower':nxt&&MON[nxt].n;
  const skyNew=res==='win'&&m.key==='boss_fire'&&firstWin,skyDone=res==='win'&&m.key==='boss_storm'&&firstWin;
  const again=m.tower?(res==='win'?'Next floor →':'Try again'):'Fight again';
  app.innerHTML=`<div class="center"><div class="rs">${res==='win'?'Victory! 🎉':'Time for a rest 😴'}</div>
  <div class="stage" style="width:100%;height:260px">${petHTML(k,p.stage,power(p),230).replace('class="pv','class="pv '+(res==='win'?'hop':''))}</div>
  <div class="info" style="width:100%">${res==='win'?`<div style="font-size:24px;font-weight:900;color:#0b6fa8">💎 +${gems}${Q.st.luck?` (luck +${Q.st.luck}%)`:''}</div>`:'<div style="font-weight:800">You lost nothing – try again, you can win!</div>'}
   <div style="font-weight:800;color:#d9480f">⭐ +${Q.gained} (answers in battle count as practice too)</div>${up?`<div style="font-weight:900;color:#7b2ff7">⚡ Power up to P${power(p)}!</div>`:''}</div>
  ${canEvolve(p)?'<button class="evo" id="evo" style="width:100%">✨ Ready to evolve! Tap me ✨</button>':''}
  ${skyNew?`<div class="lockmsg" style="background:#e8f4ff;color:#0b5fa8">☁️ Sky Adventure unlocked! Open it from the Battle map.</div>`:''}${skyDone?`<div class="lockmsg" style="background:#fff4d6;color:#a86a00">🏆 You cleared the whole Sky Adventure!</div>`:''}${firstWin&&nxt?`<div class="lockmsg" style="background:#e8fbe8;color:#14793d">🔓 New level unlocked: ${nxtName}!</div>`:''}
  ${nxt?`<button class="next" style="width:100%" id="nxt">Next level → ${nxtName}</button>`:''}
  <button class="${nxt?'ghost':'next'}" style="${nxt?'':'width:100%'}" id="again">${again}</button>
  ${res==='win'?'<button class="ghost" id="shop">🛍️ Go to shop</button>':''}
  <button class="ghost" id="sel">Back to battles</button><button class="ghost" id="home">Home</button></div>`;
  $('#again').onclick=()=>startBattle(m.tower?towerMon(res==='win'?m.tower+1:m.tower):m);
  $('#sel').onclick=battleScreen;$('#home').onclick=homeScreen;
  const nb=$('#nxt');if(nb)nb.onclick=()=>startBattle(nxt==='tower'?towerMon(p.tower+1):MON[nxt]);
  const sh=$('#shop');if(sh)sh.onclick=shopScreen;
  const ev=$('#evo');if(ev)ev.onclick=evolveScreen;
  maybeEvolve(3000);
}

/* ---------- quiz ---------- */
let Q=null;
let EVOLVING=false;
function maybeEvolve(delay){setTimeout(()=>{if(!EVOLVING&&S.current&&canEvolve(cur())&&$('#evo'))evolveScreen()},delay)}
function startRound(sk,opts){
  opts=opts||{};
  const p=cur(),P=power(p);
  Q={mode:'round',sk,change:!!opts.change,qs:opts.change?Array.from({length:5},()=>genChange(P)):pickQs(sk,5,P),i:0,gained:0,combo:0,right:0,boost:nextExam()===sk,startP:P,log:[],gems:0};
  showQ();
}
function dotsHTML(){return Q.qs.map((_,i)=>`<span class="dot ${i===Q.i?'cur':Q.log[i]==='ok'?'ok':Q.log[i]==='no'?'no':''}"></span>`).join('')}
function refreshDots(){const d=$('.dots');if(d)d.innerHTML=dotsHTML()}
function qSay(q){return q.say||(q.passage?q.passage+' '+q.text:q.text.replace(/<[^>]+>/g,' '))}
function showQ(){
  const q=Q.qs[Q.i],s=SUBJ[q.sk||Q.sk];q.attempts=0;q.done=false;
  const lang=q.lang||s.lang;
  const prompt=`${q.passage?`<div class="passage">${q.passage}</div>`:''}${q.bigch?`<div class="bigch">${q.bigch}</div>`:''}${q.emoji?`<div class="big">${q.emoji}</div>`:''}${q.scene||''}<div class="qtext">${q.text}</div><button class="speak" id="say">🔊 Listen</button>`;
  let body='';
  if(q.t==='choice'){
    q.shown=shuffle(q.opts);
    const long=q.shown.some(o=>o.length>8);
    body=`<div class="opts ${long?'one':''}">${q.shown.map((o,j)=>`<button class="opt" data-j="${j}" data-n="${j+1}">${o}${(q.sk||Q.sk)!=='math'?'<span class="osp" title="Listen">🔊</span>':''}</button>`).join('')}</div>`;
  }else{
    q.shown=shuffle(q.words);let g=0;while(q.shown.join(q.sep)===q.a&&g++<10)q.shown=shuffle(q.words);
    q.placed=[];
    body=`<div class="ans" id="ans"></div><div class="wbank" id="wb">${q.shown.map((w,j)=>`<button class="chipw" data-j="${j}">${w}</button>`).join('')}</div>`;
  }
  const head=Q.mode==='battle'?bHead():`<div class="qtop"><button class="icon-btn" id="x">✖</button><div class="dots">${dotsHTML()}</div><div class="chip">⭐ ${Q.gained}${Q.change?` · 💎 ${Q.gems}`:''}</div></div>`;
  const boostMsg=(Q.mode==='battle'?nextExam()===(q.sk):Q.boost)?'🔥 Main subject: ⭐×2':'';
  const rp=Q.mode==='round'&&S.current?`<div class="stage rpet">${petHTML(S.current,cur().stage,power(cur()),orient()==='l'?200:120)}</div>`:'';
  app.innerHTML=`<div class="qlay"><div class="qleft">${head}${rp}</div><div class="qright"><div class="qcard">${prompt}</div>${body}<div class="fb" id="fb">${boostMsg}</div><div id="nx"></div></div></div>`;
  $('#x').onclick=()=>Q.mode==='battle'?battleScreen():Q.change?shopScreen():homeScreen();
  $('#say').onclick=()=>speak(qSay(q),lang);
  setTimeout(()=>speak(qSay(q),lang),250);
  if(q.t==='choice')app.querySelectorAll('.opt').forEach(b=>{
    b.onclick=e=>{if(e&&e.target.closest&&e.target.closest('.osp')){e.stopPropagation();speak(q.shown[+b.dataset.j],lang);return}answerChoice(b)};
    if((q.sk||Q.sk)!=='math')b.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&!q.done)speak(q.shown[+b.dataset.j],lang)});
  });
  else app.querySelectorAll('#wb .chipw').forEach(b=>b.onclick=()=>moveChip(b));
}
const CHEERS=['c-hop','c-flag','c-hearts','c-stars','c-run','c-love'];
let LASTCHEER=-1;
function petFx(cls,ms){document.querySelectorAll('.qleft .pv, .petspot .pv').forEach(el=>{el.classList.remove(...CHEERS,'oops','idlehop');void el.offsetWidth;el.classList.add(cls);clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove(cls),ms)})}
function cheerPet(forced){                                    // exactly ONE reaction per right answer, never the same one twice in a row
  let i=CHEERS.indexOf(forced);
  if(i<0){do{i=Math.floor(Math.random()*CHEERS.length)}while(i===LASTCHEER)}
  LASTCHEER=i;petFx(CHEERS[i],i===4?1800:1700);
}
const oopsPet=()=>petFx('oops',650);
function award(q){
  const qs=q.sk||Q.sk;
  const base=[10,5,2][Math.min(q.attempts,2)];
  let n=base;if(nextExam()===qs)n*=2;
  let bonus=0;
  if(q.attempts===0){Q.combo++;if(Q.combo>=3)bonus=5}else Q.combo=0;
  n+=bonus;
  const p=cur();const before=power(p);
  p.stars+=n;p.correct[qs]++;ssOf(p)[qs]+=n;
  Q.gained+=n;Q.right++;
  if(Q.change){p.gems+=2;Q.gems+=2}
  if(q.id){const st=S.q[q.id]||(S.q[q.id]={r:0,w:0});st.r++}
  save();
  sndOK();popText(`+${n} ⭐${bonus?' combo!':''}${Q.change?'  +2 💎':''}`);cheerPet();
  const after=power(p);
  if(after>before){setTimeout(()=>{sndUP();popText(`⚡ Power Up! P${after}`);confetti(20)},700)}
  if(Q.mode==='battle')dealDamage();
}
function markWrong(q){
  oopsPet();
  if(q.id){const st=S.q[q.id]||(S.q[q.id]={r:0,w:0});st.w++}
  Q.combo=0;
  if(Q.mode==='battle')monsterHit();
}
function finishQ(ok){
  const q=Q.qs[Q.i];q.done=true;Q.log[Q.i]=ok?'ok':'no';
  if(Q.over)return;
  const battle=Q.mode==='battle',last=!battle&&Q.i>=Q.qs.length-1;
  $('#nx').innerHTML=`<button class="next" style="width:100%" id="go">${last?'See results 🎉':'Next →'}</button>`;
  $('#go').onclick=()=>{if(battle)nextBattleQ();else{Q.i++;Q.i<Q.qs.length?showQ():resultScreen()}};
}
function answerChoice(btn){
  const q=Q.qs[Q.i];if(q.done)return;
  const val=q.shown[+btn.dataset.j],qs=q.sk||Q.sk,lang=q.lang||SUBJ[qs].lang;
  if(qs!=='math')speak(val,lang);
  const fb=$('#fb');
  if(val===q.a){
    btn.classList.add('good');award(q);
    fb.className='fb ok';fb.textContent=['Great job! 👏','Correct! 👍','Got it!'][Math.min(q.attempts,2)];
    app.querySelectorAll('.opt').forEach(b=>b.onclick=null);
    refreshDots();finishQ(true);
  }else{
    q.attempts++;markWrong(q);sndNO();
    btn.classList.add('bad');btn.onclick=null;btn.classList.add('shake');setTimeout(()=>btn.classList.remove('shake'),400);
    if(Q.over==='lose'){lockQ();return}
    fb.className='fb no';
    if(q.attempts===1){fb.textContent='Try again 💪'}
    else if(q.attempts===2){
      fb.textContent='Hint: one wrong answer removed 👀';
      const wrongs=[...app.querySelectorAll('.opt')].filter(b=>q.shown[+b.dataset.j]!==q.a&&!b.classList.contains('bad'));
      if(wrongs.length>1)wrongs[0].classList.add('gone');
    }else{
      fb.textContent='This is the answer – remember it!';
      app.querySelectorAll('.opt').forEach(b=>{if(q.shown[+b.dataset.j]===q.a)b.classList.add('good');b.onclick=null});
      Q.log[Q.i]='no';refreshDots();finishQ(false);
    }
  }
}
function moveChip(btn){
  const q=Q.qs[Q.i];if(q.done)return;
  const j=+btn.dataset.j;
  q.placed.push(j);btn.classList.add('hide');btn.onclick=null;
  speak(q.shown[j],q.lang||SUBJ[q.sk||Q.sk].lang);
  renderAns(q);
  if(q.placed.length===q.words.length)setTimeout(()=>checkOrder(q),350);
}
function renderAns(q){
  const a=$('#ans');a.innerHTML=q.placed.map(j=>`<button class="chipw" data-j="${j}">${q.shown[j]}</button>`).join('');
  a.querySelectorAll('.chipw').forEach(b=>b.onclick=()=>{if(q.done)return;const j=+b.dataset.j;q.placed=q.placed.filter(x=>x!==j);const orig=$(`#wb .chipw[data-j="${j}"]`);orig.classList.remove('hide');orig.onclick=()=>moveChip(orig);renderAns(q)});
}
function checkOrder(q){
  if(q.done)return;
  const fb=$('#fb'),ans=q.placed.map(j=>q.shown[j]).join(q.sep);
  if(ans===q.a){award(q);fb.className='fb ok';fb.textContent='Perfect order! 👏';refreshDots();finishQ(true);return}
  q.attempts++;markWrong(q);sndNO();
  const a=$('#ans');a.classList.add('shake');setTimeout(()=>a.classList.remove('shake'),400);
  if(Q.over==='lose'){lockQ();return}
  fb.className='fb no';
  if(q.attempts<3){
    fb.textContent=q.attempts===1?'Try again 💪':'Think again – look at the first word 👀';
    q.placed=[];renderAns(q);
    app.querySelectorAll('#wb .chipw').forEach(b=>{b.classList.remove('hide');b.onclick=()=>moveChip(b)});
  }else{
    fb.textContent='Correct: '+q.a;
    q.placed=[];a.innerHTML=`<div class="qtext">${q.a}</div>`;
    speak(q.a,q.lang||SUBJ[q.sk||Q.sk].lang);
    Q.log[Q.i]='no';refreshDots();finishQ(false);
  }
}

/* ---------- result ---------- */
function resultScreen(){
  const k=S.current,p=cur(),P=power(p);
  const up=P>Q.startP;
  if(Q.change&&Q.right===5&&!Q.bonus){Q.bonus=5;p.gems+=5;Q.gems+=5;save()}
  const msg=Q.right===5?'Perfect! Super! 🏆':Q.right>=3?'Well done! Keep going 💪':'Good try – practice makes perfect 🌱';
  if(Q.right>=4)confetti(25);
  app.innerHTML=`<div class="center"><div class="rs">${msg}</div>
   <div class="stage" style="width:100%;height:280px">${petHTML(k,p.stage,P,260).replace('class="pv','class="pv hop')}</div>
   <div class="info" style="width:100%"><div>Correct: <b>${Q.right}</b> / 5</div><div style="font-size:22px;font-weight:900;color:#d9480f">⭐ +${Q.gained}${Q.boost?' (main subject ×2)':''}</div>
   ${Q.change?`<div style="font-size:22px;font-weight:900;color:#0b6fa8">💎 +${Q.gems}${Q.bonus?' (perfect bonus +5)':''}</div>`:''}
   ${up?`<div style="font-weight:900;color:#7b2ff7">⚡ Power up to P${P}!</div>`:''}</div>
   ${canEvolve(p)?'<button class="evo" id="evo" style="width:100%">✨ Ready to evolve! Tap me ✨</button>':''}
   <button class="next" style="width:100%" id="again">Play again: ${Q.change?'Change game':SUBJ[Q.sk].name}</button>
   ${Q.change?'<button class="ghost" id="shop">🛍️ Back to shop</button>':''}
   <button class="ghost" id="home">Home</button></div>`;
  $('#again').onclick=()=>startRound(Q.sk,{change:Q.change});
  $('#home').onclick=homeScreen;
  const sh=$('#shop');if(sh)sh.onclick=shopScreen;
  const e=$('#evo');if(e)e.onclick=evolveScreen;
  maybeEvolve(2600);
}

/* ---------- evolve ---------- */
function evolveScreen(){
  if(EVOLVING)return;EVOLVING=true;
  const k=S.current,p=cur(),old=p.stage,P=power(p);
  app.innerHTML=`<div class="center" style="margin-top:20px"><div class="title">Evolving…✨</div><div class="stage glow" style="width:100%;height:340px">${petHTML(k,old,P,300)}</div></div>`;
  sndUP();
  setTimeout(()=>{$('#flash').classList.add('go')},1000);
  setTimeout(()=>{
    p.stage=old+1;save();sndUP();confetti(50);
    const P2=power(p);
    app.innerHTML=`<div class="center" style="margin-top:20px"><div class="rs">Evolved! 🎉</div><div class="stage" style="width:100%;height:340px">${petHTML(k,p.stage,P2,320)}</div><div class="chip" style="font-size:20px">${PETS[k].name} evolved to Lv${p.stage}!${p.stage===3?'Power can now rise without limit ⚡':'Power cap raised ⚡'}</div><button class="next" style="width:100%" id="ok">Awesome!</button></div>`;
    $('#ok').onclick=homeScreen;
    $('#flash').classList.remove('go');EVOLVING=false;
  },1900);
}

/* ================= boot ================= */
(function(){const sk=document.getElementById('sky');let h='';
  [[6,0,70,'☁️'],[18,0,120,'☁️'],[34,-40,95,'☁️'],[55,0,150,'☁️'],[72,0,85,'☁️']].forEach(([t,d,sec,e],i)=>h+=`<span class="cl" style="top:${t}%;animation-duration:${sec}s;animation-delay:${-i*23}s;font-size:${48+i*9}px">${e}</span>`);
  for(let i=0;i<22;i++)h+=`<span class="st" style="left:${(i*47)%100}%;top:${(i*29+7)%92}%;font-size:${12+(i*5)%14}px;animation-delay:${(i*0.37)%2.6}s">${['✨','⭐','💫'][i%3]}</span>`;
  sk.innerHTML=h})();
addEventListener('keydown',e=>{
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='Enter'||e.key===' '){const g=document.querySelector('#go');if(g){e.preventDefault();g.click()}return}
  if(/^[1-4]$/.test(e.key)){const b=[...document.querySelectorAll('.opt')].filter(x=>!x.classList.contains('bad')&&!x.classList.contains('gone'))[+e.key-1];if(b)b.click()}
});
setInterval(()=>{const els=[...document.querySelectorAll('.pv')].filter(e=>!/c-|oops|idlehop/.test(e.className));
  if(!els.length)return;const e=els[Math.floor(Math.random()*els.length)];e.classList.add('idlehop');setTimeout(()=>e.classList.remove('idlehop'),700)},4200);
whoScreen();
</script>
